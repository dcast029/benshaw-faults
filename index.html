<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benshaw MX — Consulta de Fallas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@400;600;700;900&display=swap');

  :root {
    --bg: #f4f4f4;
    --panel: #ffffff;
    --border: #e0e0e0;
    --accent-mx3: #009A8D;
    --accent-mx2: #F16421;
    --green: #009A8D;
    --red: #ff3d3d;
    --yellow: #F16421;
    --text: #1a1a1a;
    --muted: #888888;
    --font-mono: 'Share Tech Mono', monospace;
    --codelco-orange: #F16421;
    --codelco-teal: #009A8D;
    --font-ui: 'Exo 2', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui); font-size: 15px;
    min-height: 100vh;
    font-size: 15px;
  }

  /* ── HEADER ── */
  .header {
    background: #ffffff;
    border-bottom: 3px solid #F16421;
    padding: 0 16px;
    display: flex;
    align-items: stretch;
    gap: 0;
    position: sticky;
    top: 0;
    z-index: 50;
    min-height: 56px;
  }
  .header-logo-block {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px 10px 0;
    border-right: 1px solid #e8e8e8;
    margin-right: 14px;
  }
  .header-logo-block svg {
    flex-shrink: 0;
  }
  .header-codelco-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .header-codelco-name {
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #F16421;
    line-height: 1;
    font-family: var(--font-ui);
  }
  .header-codelco-sub {
    font-size: 9px;
    color: #bbb;
    letter-spacing: 1.5px;
    font-family: var(--font-mono);
    line-height: 1;
  }
  .header-app-title {
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 1;
  }
  .header-app-name {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #009A8D;
    font-family: var(--font-mono);
    line-height: 1;
  }
  .header-app-sub {
    font-size: 10px;
    color: #999999;
    letter-spacing: 1px;
    font-family: var(--font-mono);
    margin-top: 3px;
  }
  .logo-badge { display: none; }
  .logo-title { display: none; }
  .sync-indicator {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .sync-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
  }
  .sync-dot.online { background: var(--green); }
  .sync-dot.syncing { background: var(--yellow); animation: pulse 1s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* ── TABS ── */
  .tabs {
    display: flex;
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    padding: 0 12px;
    gap: 2px;
    overflow-x: auto;
  }
  .tab-btn {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    font-family: var(--font-ui); font-size: 15px;
    font-size: 12px;
    font-weight: 700;
    padding: 10px 14px;
    cursor: pointer;
    letter-spacing: 1px;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .tab-btn.active-mx3 { color: var(--accent-mx3); border-bottom-color: var(--accent-mx3); }
  .tab-btn.active-mx2 { color: var(--accent-mx2); border-bottom-color: var(--accent-mx2); }
  .tab-btn.active-casos { color: var(--green); border-bottom-color: var(--green); }

  /* ── BODY ── */
  .body { padding: 14px 12px; max-width: 800px; margin: 0 auto; }

  /* ── SEARCH ── */
  .search-wrap {
    position: relative;
    margin-bottom: 16px;
  }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    color: var(--muted);
  }
  .search-input {
    width: 100%;
    background: #ffffff;
    border: 1px solid #e0e0e0;
    color: #111;
    font-family: var(--font-mono);
    font-size: 18px;
    padding: 12px 14px 12px 40px;
    border-radius: 6px;
    letter-spacing: 2px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent-mx3); }
  .search-input.mx2-mode:focus { border-color: var(--accent-mx2); }
  .search-hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    font-family: var(--font-mono);
    padding-left: 4px;
  }

  /* ── FAULT CARD ── */
  .fault-card {
    background: #ffffff;
    border: 1px solid #e0e0e0;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .fault-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
  }
  .fault-code {
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 700;
    min-width: 54px;
  }
  .fault-code.mx3 { color: var(--accent-mx3); }
  .fault-code.mx2 { color: var(--accent-mx2); }

  .fault-name {
    font-size: 13px;
    font-weight: 700;
    color: #1a1a1a;
    flex: 1;
  }
  .fault-tags {
    display: flex;
    gap: 5px;
  }
  .tag {
    font-size: 9px;
    font-family: var(--font-mono);
    padding: 2px 6px;
    border-radius: 3px;
    letter-spacing: 1px;
    font-weight: 700;
  }
  .tag-shunt { background: #ff3d3d22; color: #ff3d3d; border: 1px solid #ff3d3d44; }
  .tag-ctrl { background: #ffd60022; color: #ffd600; border: 1px solid #ffd60044; }
  .tag-auto { background: #00e67622; color: #00e676; border: 1px solid #00e67644; }
  .tag-casos { background: #009A8D22; color: #009A8D; border: 1px solid #009A8D44; }

  .chevron {
    color: var(--muted);
    font-size: 12px;
    transition: transform 0.2s;
  }
  .chevron.open { transform: rotate(90deg); }

  .fault-body {
    display: none;
    padding: 0 16px 14px;
    border-top: 1px solid #e8e8e8;
  }
  .fault-body.open { display: block; }

  .section-label {
    font-size: 10px;
    font-family: var(--font-mono);
    letter-spacing: 2px;
    margin: 12px 0 6px;
  }
  .section-label.mx3 { color: var(--accent-mx3); }
  .section-label.mx2 { color: var(--accent-mx2); }
  .section-label.green { color: var(--green); }
  .section-label.yellow { color: var(--yellow); }

  .fault-desc {
    font-size: 13px;
    color: #aab;
    line-height: 1.5;
  }

  .steps-list {
    list-style: none;
    padding: 0;
  }
  .steps-list li {
    display: flex;
    gap: 10px;
    font-size: 13px;
    color: #222222;
    padding: 5px 0;
    border-bottom: 1px solid #f0f0f0;
    line-height: 1.4;
  }
  .steps-list li:last-child { border-bottom: none; }
  .step-num {
    min-width: 20px;
    font-family: var(--font-mono);
    color: #999999;
    font-size: 12px;
    padding-top: 1px;
  }

  .casos-list { margin-top: 4px; }
  .caso-item {
    background: #f7f7f7;
    border: 1px solid #e8e8e8;
    border-left: 3px solid #009A8D;
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .caso-meta {
    display: flex;
    gap: 10px;
    color: var(--muted);
    font-size: 10px;
    font-family: var(--font-mono);
    margin-bottom: 5px;
  }
  .caso-texto { color: #222222; line-height: 1.5; }

  .btn-add-caso {
    background: transparent;
    border: 1px dashed #c0d0ce;
    color: #009A8D;
    padding: 7px 14px;
    border-radius: 4px;
    font-family: var(--font-ui); font-size: 15px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
    width: 100%;
    margin-top: 6px;
  }
  .btn-add-caso:hover { background: #a78bfa15; border-color: #a78bfa; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #000a;
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #ffffff;
    border: 1px solid #ddd;
    border-bottom: none;
    border-radius: 12px 12px 0 0;
    padding: 20px 16px;
    width: 100%;
    max-width: 600px;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }

  .modal-title {
    font-size: 13px;
    font-weight: 700;
    color: #009A8D;
    letter-spacing: 1px;
    margin-bottom: 14px;
  }
  .modal-fault-ref {
    font-family: var(--font-mono);
    font-size: 11px;
    color: #888888;
    margin-bottom: 14px;
  }
  .form-label {
    display: block;
    font-size: 10px;
    font-family: var(--font-mono);
    letter-spacing: 2px;
    color: #777777;
    margin-bottom: 5px;
  }
  .form-input, .form-textarea {
    width: 100%;
    background: #0d1117;
    border: 1px solid var(--border);
    color: #fff;
    font-family: var(--font-ui); font-size: 15px;
    font-size: 13px;
    padding: 9px 12px;
    border-radius: 4px;
    margin-bottom: 12px;
    outline: none;
  }
  .form-textarea { min-height: 90px; resize: vertical; }
  .form-input:focus, .form-textarea:focus { border-color: #009A8D; }
  .modal-btns { display: flex; gap: 10px; }
  .btn-cancel {
    background: transparent;
    border: 1px solid #ddd;
    color: #888;
    padding: 9px 18px;
    border-radius: 4px;
    font-family: var(--font-ui); font-size: 15px;
    font-size: 12px;
    cursor: pointer;
  }
  .btn-save {
    background: #a78bfa;
    border: none;
    color: #000;
    padding: 9px 18px;
    border-radius: 4px;
    font-family: var(--font-ui); font-size: 15px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    flex: 1;
  }

  /* ── TAB CASOS ── */
  .casos-full .caso-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid #009A8D;
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .casos-full .caso-card h4 {
    font-size: 12px;
    color: #009A8D;
    font-family: var(--font-mono);
    margin-bottom: 5px;
  }
  .casos-full .caso-card p {
    font-size: 13px;
    color: #222222;
    line-height: 1.5;
  }
  .casos-full .caso-card .meta {
    font-size: 10px;
    color: var(--muted);
    margin-top: 6px;
    font-family: var(--font-mono);
  }

  /* ── SYNC PANEL ── */
  .sync-panel {
    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .sync-title {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--green);
    letter-spacing: 2px;
    margin-bottom: 10px;
  }
  .sync-desc {
    font-size: 12px;
    color: #555555;
    line-height: 1.5;
    margin-bottom: 12px;
  }
  .btn-sync {
    background: var(--green);
    border: none;
    color: #000;
    padding: 8px 16px;
    border-radius: 4px;
    font-family: var(--font-ui); font-size: 15px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .btn-export {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 4px;
    font-family: var(--font-ui); font-size: 15px;
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 1px;
    margin-left: 8px;
  }

  .no-results {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 40px 20px;
    font-family: var(--font-mono);
  }
  .no-results span { font-size: 28px; display: block; margin-bottom: 10px; }


  /* ── CONFIG BANNER ── */
  .config-banner {
    background: #fff8f0;
    border: 1px solid #F1642144;
    border-left: 4px solid #F16421;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .config-title {
    font-size: 12px;
    font-family: var(--font-mono);
    color: #F16421;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .config-desc {
    font-size: 12px;
    color: #555;
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .btn-config {
    background: #F16421;
    border: none;
    color: #fff;
    padding: 7px 14px;
    border-radius: 4px;
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .instr-step {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
    font-size: 12px;
    color: #444;
    line-height: 1.6;
  }
  .instr-num {
    min-width: 24px;
    height: 24px;
    background: #F16421;
    color: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .instr-step code {
    background: #f0f0f0;
    padding: 1px 5px;
    border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: #009A8D;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #e8f9f5;
    border: 1px solid #009A8D;
    color: #009A8D;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 12px;
    font-family: var(--font-mono);
    z-index: 200;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .empty-casos {
    text-align: center;
    color: #aaaaaa;
    font-size: 12px;
    padding: 30px;
    font-family: var(--font-mono);
  }
</style>
</head>
<body>

<!-- AVISO DESCARGA -->
<noscript>
<div style="background:#F16421;color:#fff;padding:16px;text-align:center;font-family:sans-serif;font-size:14px;font-weight:bold;">
  ⚠ Para usar esta app, descárgala al PC o celular y ábrela con Chrome o Edge.<br>
  <span style="font-weight:normal;font-size:12px;">Teams no permite ejecutar apps HTML. Haz clic en los tres puntos ··· → Descargar</span>
</div>
</noscript>
<div id="downloadBanner" style="display:none;background:#F16421;color:#fff;padding:12px 16px;text-align:center;font-family:sans-serif;font-size:13px;">
  ⚠ <strong>Descarga el archivo</strong> para usarlo — Teams no puede ejecutar la app directamente.<br>
  <span style="font-size:11px;">Haz clic en ··· → Descargar → ábrelo con Chrome o Edge</span>
</div>

<!-- HEADER -->
<div class="header">
  <div class="header-logo-block">
    <!-- Logo Codelco SVG fiel al isotipo oficial -->
    <svg width="48" height="52" viewBox="0 0 48 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Elipse exterior horizontal -->
      <ellipse cx="24" cy="17" rx="22" ry="12" fill="none" stroke="#F16421" stroke-width="2.5"/>
      <!-- Círculo interior relleno -->
      <circle cx="24" cy="17" r="8.5" fill="#F16421"/>
      <!-- Palo vertical abajo del círculo -->
      <line x1="24" y1="25.5" x2="24" y2="37" stroke="#F16421" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Barra horizontal cruzada -->
      <line x1="17" y1="32" x2="31" y2="32" stroke="#F16421" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <div class="header-codelco-text">
      <div class="header-codelco-name">CODELCO</div>
      <div class="header-codelco-sub">CORP. NACIONAL DEL COBRE</div>
    </div>
  </div>
  <div class="header-app-title">
    <div class="header-app-name">BENSHAW FAULT GUIDE</div>
    <div class="header-app-sub">MX3 ESTÁTOR &nbsp;·&nbsp; MX2 ROTOR</div>
  </div>
  <div class="sync-indicator">
    <div class="sync-dot" id="syncDot"></div>
    <span id="syncStatus">offline</span>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab-btn active-mx3" onclick="setTab('mx3')">MX3 ESTÁTOR</button>
  <button class="tab-btn" onclick="setTab('mx2')">MX2 ROTOR</button>
  <button class="tab-btn" onclick="setTab('casos')">CASOS COLEGAS</button>
</div>

<!-- BODY -->
<div class="body" id="mainBody">
  <div class="search-wrap" id="searchWrap">
    <span class="search-icon">🔍</span>
    <input type="text" class="search-input" id="searchInput"
      placeholder="F41 o palabra clave..."
      oninput="renderFaults()"
      autocomplete="off" autocapitalize="off">
    <div class="search-hint" id="searchHint">Ingresa código (F01, F41...) o descripción</div>
  </div>
  <div id="faultList"></div>
</div>

<!-- MODAL NUEVO CASO -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title">✦ AGREGAR CASO</div>
    <div class="modal-fault-ref" id="modalFaultRef"></div>

    <label class="form-label">TU NOMBRE / ROL</label>
    <input type="text" class="form-input" id="casoAutor" placeholder="Ej: Juan, Eléctrico turno A">

    <label class="form-label">¿QUÉ PASÓ Y CÓMO SE RESOLVIÓ?</label>
    <textarea class="form-textarea" id="casoTexto"
      placeholder="Ej: Apareció F41 al arranque, revisamos bypass contactor y estaba pegado. Se limpió contacto y reset."></textarea>

    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">CANCELAR</button>
      <button class="btn-save" onclick="saveCaso()">GUARDAR CASO</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════════
//  CONFIGURACIÓN — EDITAR SOLO ESTAS 2 LÍNEAS
// ════════════════════════════════════════════════
const SP_CONFIG = {
  siteUrl: "https://codelcochile.sharepoint.com/teams/GuardiaElectrica.SonnyRamirezConcentradora",
  listName: "BenshawCasos",
};

// ════════════════════════════════════════════════
//  BASE DE DATOS FALLAS MX3 / MX2
// ════════════════════════════════════════════════
const MX3_FAULTS = [
  { code:"F01", name:"UTS Time Limit Expired",
    desc:"Motor no alcanzó velocidad plena antes de que expirara el timer UTS (QST 09). Indica motor atascado, sobrecargado o rampa de aceleración insuficiente.",
    steps:["Verificar si el motor está atascado mecánicamente o con carga excesiva","Revisar que el tiempo combinado de kick (CFN 12) + rampa aceleración (QST 08) sea menor que el timer UTS (QST 09)","Evaluar ajustes de rampa de aceleración — puede ser muy baja para vencer la inercia","Aumentar el timer UTS (QST 09) si es aceptable operacionalmente"],
    ctrl:"Y", shunt:"N", auto:"Y" },
  { code:"F02", name:"Motor Thermal Overload Trip",
    desc:"Sobrecarga térmica del motor. El contenido térmico alcanzó 100%. Puede ocurrir durante arranque por rampa insuficiente o falla en calidad de línea.",
    steps:["Verificar configuración de sobrecarga térmica (QST 03, PFN 28–35) y factor de servicio (QST 02)","Confirmar FLA del motor (QST 01) y relación CT (FUN 03)","Si ocurre durante arranque, revisar perfil de rampa de aceleración","Verificar que no haya problema de calidad de línea o distorsión excesiva","Verificar que PF caps estén antes de los CTs","Reset sobrecarga cuando el contenido caiga bajo el nivel de lockout (PFN 34)"],
    ctrl:"Y", shunt:"N", auto:"Y" },
  { code:"F03", name:"Slow Speed Time Limit Expired",
    desc:"El timer de baja velocidad expiró. Aumentar Slow Speed Timer (CFN 25).",
    steps:["Aumentar el parámetro Slow Speed Timer (CFN 25)"],
    ctrl:"N", shunt:"N", auto:"N" },
  { code:"F04", name:"Speed Switch Time Limit Expired",
    desc:"El switch de velocidad no detectó velocidad en el tiempo configurado.",
    steps:["Aumentar Speed Switch Time (PFN 26)","Acelerar el motor más rápido","Verificar sensor/switch de velocidad"],

let casos = [];
let currentTab = 'mx3';
let currentFaults = MX3_FAULTS;
let modalFaultCode = '';
let modalFaultDevice = '';
let openCards = new Set();
let spReady = false;
let requestDigest = null;

function isConfigured() {
  return !SP_CONFIG.siteUrl.includes('TU-SITIO');
}

// ════════════════════════════════════════════════
//  SHAREPOINT REST — SIN AZURE, USA SESIÓN ACTIVA
// ════════════════════════════════════════════════
const SP_API = () => `${SP_CONFIG.siteUrl}/_api/lists/getbytitle('${SP_CONFIG.listName}')/items`;

async function getDigest() {
  // Obtiene el form digest de SharePoint (necesario para POST/writes)
  const resp = await fetch(`${SP_CONFIG.siteUrl}/_api/contextinfo`, {
    method: 'POST',
    headers: { 'Accept': 'application/json;odata=verbose' },
    credentials: 'include'  // Usa la sesión activa del navegador
  });
  if (!resp.ok) throw new Error('No se pudo obtener digest');
  const data = await resp.json();
  requestDigest = data.d.GetContextWebInformation.FormDigestValue;
  return requestDigest;
}

async function loadCasosSharePoint() {
  if (!isConfigured()) { loadCasosLocal(); return; }
  try {
    showSyncStatus('syncing');
    const url = SP_API() + '?$select=Id,Title,Texto,Autor,Fecha,Device&$orderby=Created%20desc&$top=500';
    const resp = await fetch(url, {
      headers: { 'Accept': 'application/json;odata=verbose' },
      credentials: 'include'
    });
    if (resp.status === 403 || resp.status === 401) {
      // No autenticado o sin permiso — usar local
      throw new Error('auth');
    }
    if (!resp.ok) throw new Error('SP ' + resp.status);
    const data = await resp.json();
    casos = data.d.results.map(item => ({
      id: item.Id,
      code: item.Title,
      device: item.Device || 'mx3',
      autor: item.Autor || 'Anónimo',
      texto: item.Texto || '',
      fecha: item.Fecha || ''
    }));
    saveCasosLocal();
    showSyncStatus('online');
    spReady = true;
    return true;
  } catch(e) {
    console.warn('SP load error:', e.message);
    loadCasosLocal();
    showSyncStatus(navigator.onLine ? 'nosp' : 'offline');
    spReady = false;
    return false;
  }
}

async function saveCasoSharePoint(caso) {
  if (!isConfigured() || !spReady) return false;
  try {
    if (!requestDigest) await getDigest();
    const listItemType = await getListItemType();
    const body = JSON.stringify({
      __metadata: { type: listItemType },
      Title: caso.code,
      Texto: caso.texto,
      Autor: caso.autor,
      Fecha: caso.fecha,
      Device: caso.device
    });
    const resp = await fetch(SP_API(), {
      method: 'POST',
      headers: {
        'Accept': 'application/json;odata=verbose',
        'Content-Type': 'application/json;odata=verbose',
        'X-RequestDigest': requestDigest
      },
      credentials: 'include',
      body
    });
    if (!resp.ok) {
      // Digest expirado, renovar y reintentar
      await getDigest();
      const resp2 = await fetch(SP_API(), {
        method: 'POST',
        headers: {
          'Accept': 'application/json;odata=verbose',
          'Content-Type': 'application/json;odata=verbose',
          'X-RequestDigest': requestDigest
        },
        credentials: 'include',
        body
      });
      if (!resp2.ok) throw new Error('SP save ' + resp2.status);
    }
    return true;
  } catch(e) {
    console.error('SP save error:', e);
    return false;
  }
}

async function getListItemType() {
  // Obtiene el tipo correcto para el list item
  try {
    const resp = await fetch(`${SP_CONFIG.siteUrl}/_api/lists/getbytitle('${SP_CONFIG.listName}')?$select=ListItemEntityTypeFullName`, {
      headers: { 'Accept': 'application/json;odata=verbose' },
      credentials: 'include'
    });
    const data = await resp.json();
    return data.d.ListItemEntityTypeFullName;
  } catch {
    return `SP.Data.${SP_CONFIG.listName}ListItem`;
  }
}

// ════════════════════════════════════════════════
//  LOCAL STORAGE FALLBACK
// ════════════════════════════════════════════════
function loadCasosLocal() {
  try {
    const saved = localStorage.getItem('benshaw_casos');
    casos = saved ? JSON.parse(saved) : [];
  } catch { casos = []; }
}
function saveCasosLocal() {
  try { localStorage.setItem('benshaw_casos', JSON.stringify(casos)); } catch {}
}

// ════════════════════════════════════════════════
//  TABS
// ════════════════════════════════════════════════
function setTab(tab) {
  currentTab = tab;
  openCards.clear();
  document.querySelectorAll('.tab-btn').forEach(b => b.className = 'tab-btn');
  const btns = document.querySelectorAll('.tab-btn');
  if (tab === 'mx3') { btns[0].classList.add('active-mx3'); currentFaults = MX3_FAULTS; }
  else if (tab === 'mx2') { btns[1].classList.add('active-mx2'); currentFaults = MX2_FAULTS; }
  else btns[2].classList.add('active-casos');
  const sw = document.getElementById('searchWrap');
  if (tab === 'casos') { sw.style.display = 'none'; renderCasos(); }
  else {
    sw.style.display = 'block';
    document.getElementById('searchInput').className = 'search-input' + (tab === 'mx2' ? ' mx2-mode' : '');
    renderFaults();
  }
}

// ════════════════════════════════════════════════
//  RENDER FAULTS
// ════════════════════════════════════════════════
function renderFaults() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const color = currentTab === 'mx3' ? 'mx3' : 'mx2';
  let filtered = currentFaults;
  if (q) filtered = currentFaults.filter(f =>
    f.code.toLowerCase().includes(q) || f.name.toLowerCase().includes(q) ||
    f.desc.toLowerCase().includes(q) || f.steps.some(s => s.toLowerCase().includes(q))
  );
  const list = document.getElementById('faultList');
  if (filtered.length === 0) {
    list.innerHTML = `<div class="no-results"><span>⚡</span>No se encontraron fallas para "${q}"</div>`;
    return;
  }
  list.innerHTML = filtered.map(f => {
    const fCasos = casos.filter(c => c.code === f.code && c.device === currentTab);
    const isOpen = openCards.has(f.code + currentTab);
    return `
    <div class="fault-card" id="card-${f.code}">
      <div class="fault-header" onclick="toggleCard('${f.code}')">
        <div class="fault-code ${color}">${f.code}</div>
        <div style="flex:1">
          <div class="fault-name">${f.name}</div>
          <div class="fault-tags" style="margin-top:4px">
            ${fCasos.length > 0 ? `<span class="tag tag-casos">✦ ${fCasos.length} CASO${fCasos.length>1?'S':''}</span>` : ''}
          </div>
        </div>
        <div style="margin-left:auto"><span class="chevron ${isOpen?'open':''}">▶</span></div>
      </div>
      <div class="fault-body ${isOpen?'open':''}">
        <div class="section-label ${color}">DESCRIPCIÓN</div>
        <div class="fault-desc">${f.desc}</div>
        <div class="section-label yellow">PASOS A VERIFICAR</div>
        <ul class="steps-list">
          ${f.steps.map((s,i) => `<li><span class="step-num">${i+1}.</span><span>${s}</span></li>`).join('')}
        </ul>
        <div class="section-label green">CASOS DE COLEGAS</div>
        ${fCasos.length === 0
          ? '<div style="font-size:12px;color:#aaa;padding:4px 0 8px">Sin casos registrados aún.</div>'
          : `<div class="casos-list">${fCasos.map(c => `
            <div class="caso-item">
              <div class="caso-meta">
                <span>● ${c.autor}</span>
                <span>${c.fecha}</span>
                ${c._local ? '<span style="color:#F16421;font-size:10px">local</span>' : ''}
              </div>
              <div class="caso-texto">${c.texto}</div>
            </div>`).join('')}</div>`
        }
        <button class="btn-add-caso" onclick="openModal('${f.code}','${currentTab}')">+ AGREGAR MI CASO</button>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(code) {
  const key = code + currentTab;
  if (openCards.has(key)) openCards.delete(key); else openCards.add(key);
  renderFaults();
  setTimeout(() => { const el = document.getElementById('card-' + code); if (el) el.scrollIntoView({behavior:'smooth',block:'nearest'}); }, 50);
}

//  MODAL
// ════════════════════════════════════════════════
function openModal(code, device) {
  modalFaultCode = code; modalFaultDevice = device;
  document.getElementById('modalFaultRef').textContent = (device==='mx3'?'MX3 Estátor':'MX2 Rotor') + ' — ' + code;
  document.getElementById('casoAutor').value = '';
  document.getElementById('casoTexto').value = '';
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

async function saveCaso() {
  const autor = document.getElementById('casoAutor').value.trim() || 'Anónimo';
  const texto = document.getElementById('casoTexto').value.trim();
  if (!texto) { alert('Describe qué pasó y cómo se resolvió.'); return; }
  const now = new Date();
  const fecha = now.toLocaleDateString('es-CL') + ' ' + now.toLocaleTimeString('es-CL', {hour:'2-digit',minute:'2-digit'});
  const caso = { code: modalFaultCode, device: modalFaultDevice, autor, texto, fecha };
  closeModal();
  const btnSave = document.querySelector('.btn-save');
  if (btnSave) { btnSave.textContent = 'GUARDANDO...'; btnSave.disabled = true; }
  let savedToSP = false;
  if (isConfigured() && spReady) {
    savedToSP = await saveCasoSharePoint(caso);
  }
  if (!savedToSP) caso._local = true;
  casos.push(caso);
  saveCasosLocal();
  if (btnSave) { btnSave.textContent = 'GUARDAR CASO'; btnSave.disabled = false; }
  showToast(savedToSP ? '✓ Caso guardado en SharePoint — visible para todos' : '✓ Guardado local — conecta a SharePoint para compartir');
  openCards.add(modalFaultCode + currentTab);
  renderFaults();
}

// ════════════════════════════════════════════════
//  SYNC STATUS
// ════════════════════════════════════════════════
function showSyncStatus(state) {
  const dot = document.getElementById('syncDot');
  const status = document.getElementById('syncStatus');
  if (!dot) return;
  const states = {
    online:   ['sync-dot online', 'online'],
    syncing:  ['sync-dot syncing', 'sincronizando...'],
    nosp:     ['sync-dot', 'solo local'],
    offline:  ['sync-dot', 'offline']
  };
  const [cls, txt] = states[state] || states.offline;
  dot.className = cls; status.textContent = txt;
}
function checkConnectivity() { showSyncStatus(navigator.onLine ? 'online' : 'offline'); }
window.addEventListener('online', checkConnectivity);
window.addEventListener('offline', checkConnectivity);

// ════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async function() {
  loadCasosLocal();   // Siempre cargar local primero
  checkConnectivity();
  renderFaults();
  if (isConfigured() && navigator.onLine) {
    await loadCasosSharePoint();
    renderFaults();
  }
});

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
</script>
</body>
</html>
